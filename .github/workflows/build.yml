name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WindChargeCounter
        uses: actions/checkout@v4

      - name: Checkout m4lib
        uses: actions/checkout@v4
        with:
          repository: m4ssivee/m4lib
          path: m4lib

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and install m4lib to mavenLocal
        working-directory: m4lib
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon

      - name: Build WindChargeCounter
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: WindChargeCounter-jars
          path: |
            versions/*/build/libs/*.jar
            m4lib/versions/*/build/libs/*.jar
            !**/*-sources.jar
          if-no-files-found: error
